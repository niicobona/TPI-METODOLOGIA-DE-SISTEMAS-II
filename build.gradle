plugins {
    id 'java'
    id 'pmd'
    id 'jacoco' // <-- 1. Añadimos el plugin de JaCoCo
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Aseguramos que JaCoCo recopile los datos durante la ejecución de los tests
    finalizedBy jacocoTestReport
}

// Configuración de los reportes de Cobertura
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = false
        html.required = true // Genera una interfaz visual detallada en HTML
    }
}

pmd {
    toolVersion = '7.0.0'
    ruleSets = [
            'category/java/errorprone.xml',
            'category/java/bestpractices.xml'
    ]
}

tasks.withType(Pmd).configureEach {
    exclude '**/org/example/Main.java'
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        googleJavaFormat()
    }
}